services:
  db:
    image: postgres:17-alpine
    container_name: turismo-postgres
    restart: unless-stopped
    env_file:
      - backend/Turist.Api/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turismo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
