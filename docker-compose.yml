services:
  db:
    image: postgres:17-alpine
    container_name: turismo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: turismo
      POSTGRES_PASSWORD: turismo123
      POSTGRES_DB: turismo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo -d turismo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
